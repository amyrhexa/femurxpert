name: Build Standalone Windows Executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify ONNX model
        shell: bash
        run: |
          if [ ! -s "best.onnx" ]; then
            echo "::error::'best.onnx' is missing or uncommitted (check .gitignore or Git LFS)."
            exit 1
          fi
          size=$(wc -c < best.onnx)
          if [ "$size" -lt 1000000 ]; then
            echo "::error::'best.onnx' is only $size bytes. Ensure Git LFS pulled the actual weights."
            exit 1
          fi

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka zstandard ordered-set

      - name: Compile with Nuitka (Windows Onefile)
        shell: pwsh
        run: |
          $extraFlags = @()
          if (Test-Path "app.ico") {
            $extraFlags += "--include-data-files=app.ico=app.ico"
            $extraFlags += "--windows-icon-from-ico=app.ico"
          }

          python -m nuitka `
            --onefile `
            --enable-plugin=pyside6 `
            --include-package-data=onnxruntime `
            --include-package=cv2 `
            --include-data-files=best.onnx=best.onnx `
            --nofollow-import-to=torch,sympy `
            --low-memory `
            --windows-console-mode=disable `
            --assume-yes-for-downloads `
            --output-dir=dist `
            --output-filename=FemurXpert.exe `
            @extraFlags `
            femurxpert.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FemurXpert.exe
          path: dist/FemurXpert.exe
          retention-days: 7

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: FemurXpert.exe
          path: release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/FemurXpert.exe
          generate_release_notes: true
